<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Voice-Office-Hub — Admin</title>

  <!-- Icons + PWA -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!--
    Fensterleiste/Statusleiste in der Farbe des APP-Hintergrunds, nicht in der Logo-Farbe:
    Als installierte App färbt theme-color bei Chrome die komplette Titelleiste — ein
    orangener Balken über der petrolfarbenen Oberfläche wirkt wie ein Fremdkörper. Orange
    bleibt Akzent (Logo, Badges), wo es auf kleiner Fläche funktioniert.
    Werte = --gl-color-bg-dark / hell aus GlassKit. Beim manuellen Theme-Wechsel zieht
    app.js das aktive Tag nach (die Media-Query kennt nur die OS-Einstellung).
  -->
  <meta name="theme-color" content="#0e2530" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="VOH" />

  <!-- GlassKit (Light-DOM-Klassen) + Tokens -->
  <link rel="stylesheet" href="/vendor/glasskit/glasskit.min.css" />
  <!-- App-eigene Styles (Reset, App-Spalte, View-Transitions, Chrome) -->
  <link rel="stylesheet" href="/app.css" />

  <!-- GlassKit-Elements (definiert die <glk-*> global) -->
  <script defer src="/vendor/glasskit-elements/glasskit-elements.min.js"></script>

  <!-- Hybrids per Import-Map -->
  <script type="importmap">
    { "imports": { "hybrids": "/vendor/hybrids/index.js" } }
  </script>

  <!-- App-Bootstrap -->
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="glass-bg">
    <app-root id="app"></app-root>
  </div>
</body>
</html>
