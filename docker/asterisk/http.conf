; HTTP-Server aktivieren — Voraussetzung für ARI.
; Nur intern (localhost) erreichbar; nach außen NICHT exponieren.
[general]
; Dieselbe Kennung wie in pjsip.conf (der entrypoint setzt beide). Sie steht im
; `Server`-Header — auch in der Upgrade-Antwort auf /ws, die der Admin-Server an den
; Browser durchreicht.
servername = VOH Appliance
enabled = yes
bindaddr = 127.0.0.1
bindport = 8088
